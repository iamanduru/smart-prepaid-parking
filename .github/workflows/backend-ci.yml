name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_prepaid_parking_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 4001
      FRONTEND_URL: http://localhost:3000

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_prepaid_parking_test?schema=integration_test

      JWT_SECRET: ci-integration-test-jwt-secret-that-is-long-enough

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create integration test environment
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=4001
          FRONTEND_URL=http://localhost:3000
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/smart_prepaid_parking_test?schema=integration_test
          JWT_SECRET=ci-integration-test-jwt-secret-that-is-long-enough
          EOF

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply integration database migrations
        run: npm run test:db:migrate

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Run integration tests
        run: npm run test:integration

      - name: Build backend
        run: npm run build